name: Test Org Pulse Module
description: Runs integration tests for a specific Org Pulse module

inputs:
  module:
    description: 'Module name (e.g., ai-impact)'
    required: true

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies and setup workspace
      shell: bash
      run: npm ci && npm run setup

    - name: Pull core images
      shell: bash
      run: make pull-core-images
      env:
        CONTAINER_RUNTIME: docker

    - name: Build AI Eng backend image
      shell: bash
      run: make build-backend-image
      env:
        CONTAINER_RUNTIME: docker

    - name: Build AI Eng frontend image
      shell: bash
      run: make build-frontend-image
      env:
        CONTAINER_RUNTIME: docker

    - name: Run integration tests
      shell: bash
      run: make test-module MODULE=$MODULE
      env:
        CONTAINER_RUNTIME: docker
        MODULE: ${{ inputs.module }}

    # The ai-catalyst feed-sync spec self-skips under the demo-mode backend
    # that test-module boots, so run it here against a non-demo backend with
    # a dummy feed token and loopback allowed (see Makefile target).
    - name: Run ai-catalyst feed-sync tests (non-demo backend)
      if: ${{ inputs.module == 'ai-catalyst' }}
      shell: bash
      run: make test-ai-catalyst-feed-sync
      env:
        CONTAINER_RUNTIME: docker
